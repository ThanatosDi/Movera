name: Builder

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            slug: "amd64"
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: "arm64"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=thanatosdi/movera,push-by-digest=true,push=true
          cache-from: type=gha,scope=build-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.slug }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          # touch "/tmp/digests/${digest#sha256:}"
          echo "${digest#sha256:}" > "/tmp/digests/${digest#sha256:}"

      - name: Upload Digest Artifact
        uses: actions/upload-artifact@v7
        with:
          name: movera-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Extract version and tags
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # semver pre-release（含 -，如 4.4.0-rc1）不覆蓋 latest
          if [[ "$version" == *-* ]]; then
            echo "pre-release：${version}，略過 latest tag"
          else
            echo "正式版：${version}，更新 latest tag"
          fi
          {
            echo "tags<<EOF"
            [[ "$version" == *-* ]] || echo "latest"
            echo "$version"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Merge manifests
        uses: ThanatosDi/merge-images-digests@main
        with:
          image-name: thanatosdi/movera
          artifact-pattern: movera-*
          tags: ${{ steps.version.outputs.tags }}
          registry-username: ${{ vars.DOCKERHUB_USERNAME }}
          registry-password: ${{ secrets.DOCKERHUB_TOKEN }}
